kind: pipeline
type: docker
name: werewolf-agent-ci

steps:
  - name: test
    image: python:3.12-slim
    commands:
      - pip install -r requirements.txt -q
      - python -m compileall app/

  - name: deploy
    image: docker:27
    volumes:
      - name: docker-sock
        path: /var/run/docker.sock
      - name: project-dir
        path: /deploy
    commands:
      - apk add --no-cache git
      - cd /deploy
      - git pull origin main
      - docker compose -p werewolf-agent-langgraph down
      - docker rm -f werewolf-agent-langgraph 2>/dev/null || true
      - docker compose -p werewolf-agent-langgraph build werewolf-agent
      - docker compose -p werewolf-agent-langgraph up -d --force-recreate --remove-orphans werewolf-agent
    when:
      branch:
        - main
      event:
        - push

volumes:
  - name: docker-sock
    host:
      path: /var/run/docker.sock
  - name: project-dir
    host:
      path: /root/werewolf-agent-langgraph

trigger:
  branch:
    - main
    - develop
  event:
    - push
    - pull_request
    - custom
