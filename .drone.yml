kind: pipeline
type: docker
name: werewolf-agent-ci

steps:
  - name: test
    image: python:3.12-slim
    commands:
      - pip install -r requirements.txt -q
      - python -m compileall app/

  - name: deploy
    image: docker:27-cli
    volumes:
      - name: docker-sock
        path: /var/run/docker.sock
      - name: project-dir
        path: /deploy
    commands:
      - apk add --no-cache git docker-cli-compose
      # Only application source is synced; production keeps its own .env.
      - git -C /drone/src archive --format=tar --output=/tmp/source.tar HEAD app Dockerfile requirements.txt docker-compose.yml migrations scripts
      - tar -xf /tmp/source.tar -C /deploy
      - cd /deploy
      - docker compose -p werewolf-agent-langgraph build werewolf-agent
      - docker compose -p werewolf-agent-langgraph up -d --force-recreate --remove-orphans werewolf-agent
      - docker image prune -f
    when:
      branch:
        - main
      event:
        - push

volumes:
  - name: docker-sock
    host:
      path: /var/run/docker.sock
  - name: project-dir
    host:
      path: /opt/werewolf/werewolf-agent-langgraph

trigger:
  branch:
    - main
    - develop
  event:
    - push
    - pull_request
    - custom
