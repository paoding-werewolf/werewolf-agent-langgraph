services:
  werewolf-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: werewolf-agent-langgraph
    ports:
      - "8082:7861"
      - "8083:7860"
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - WEREWOLF_AGENT_HOME=/root/.werewolf-agent
    volumes:
      - /opt/werewolf-agent-data:/root/.werewolf-agent
